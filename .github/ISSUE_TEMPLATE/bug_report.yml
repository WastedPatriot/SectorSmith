name: 🐞 Bug report
description: Something didn't work as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Mossbit and the maintainers will take a look.
        **Never attach client data.** Logs don't contain file contents.
  - type: input
    id: version
    attributes:
      label: SectorSmith version
      description: Shown under the logo in the sidebar (e.g. v1.3.0)
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: Which task?
      options: [Recover files, Find lost partitions, Wipe a drive, Shred files, Check drive health, Back up / clone, Move a user, Connect a machine, Clone to another PC, Advanced tools, Installing / starting the app]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: textarea
    id: log
    attributes:
      label: Log (last ~50 lines)
      description: "%LOCALAPPDATA%\\SectorSmith\\sectorsmith.log"
      render: text
