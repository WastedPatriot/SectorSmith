name: Build & test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint & security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff bandit
      - name: Ruff (errors & undefined names)
        run: ruff check --select E9,F sectorsmith tests tools
      - name: Bandit (medium+ security issues)
        run: bandit -r sectorsmith -ll

  engine-tests:
    name: Engine tests (Linux disk images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disk tools
        run: sudo apt-get update && sudo apt-get install -y gdisk fdisk dosfstools mtools ntfs-3g e2fsprogs qemu-utils
      - run: pip install pillow cryptography olefile
      - name: Build test disk (GPT with FAT32 + NTFS + ext4)
        run: python tests/build_test_disk.py "$RUNNER_TEMP/sstest"
      - name: Run engine tests
        run: python tests/test_core.py "$RUNNER_TEMP/sstest"
      - name: Run hardware erase and certificate tests (fake drives, QR round trip)
        run: python tests/test_sanitize.py "$RUNNER_TEMP/sssanitize"
      - name: Run integration tests (ScreenConnect, Active Directory lookup, DPAPI)
        run: python tests/test_integrations.py
      - name: Run Link tests (encrypted pairing, user migration, network clone)
        run: python tests/test_link.py "$RUNNER_TEMP/sstest"
      - name: Run Deploy tests (installer analysis, maintenance sessions, script export)
        run: python tests/test_deploy.py "$RUNNER_TEMP/ssdeploy"
      - name: Run job history tests (store, filters, CSV export)
        run: python tests/test_jobs.py "$RUNNER_TEMP/ssjobs"

  windows:
    name: Windows integration + build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Real-disk integration test (virtual disk via diskpart)
        run: python tests/test_windows.py
      - name: Deploy end-to-end test (test MSI and script package through a Link agent)
        run: python tests/test_deploy_windows.py
        timeout-minutes: 20
      - name: Integration tests on Windows (DPAPI round trip, registry read)
        run: python tests/test_integrations.py
      - name: Import check (UI)
        run: python -c "import sectorsmith.ui.main, sectorsmith.app; print('UI modules import OK')"
      - name: Build SectorSmith.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name SectorSmith
          --icon sectorsmith/ui/assets/mark.ico
          --add-data "sectorsmith/ui/assets;sectorsmith/ui/assets"
          --collect-submodules sectorsmith --collect-all customtkinter --collect-all tkinterdnd2 run_sectorsmith.py
      - name: Self-test the built exe (every screen must load)
        shell: pwsh
        run: |
          $p = Start-Process dist\SectorSmith.exe -ArgumentList "--no-elevate","--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "exe self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: SectorSmith-windows
          path: dist/SectorSmith.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/SectorSmith.exe
          generate_release_notes: true
